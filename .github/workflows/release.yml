name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0). Must already exist."
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-front:
    name: Build front-end bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # On workflow_dispatch the user supplies an existing tag; check it out
          # so the build matches the tag exactly. On tag push, github.ref is
          # already the tag ref.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install Vite+ (vp)
        run: |
          curl -fsSL https://vite.plus | bash
          # The installer drops the binary somewhere under $HOME and has moved it
          # before, so probe every known location and fail loudly when none has it
          # rather than letting the next step die with "vp: command not found".
          for dir in "$HOME/.local/share/vite-plus/bin" "$HOME/.vite-plus/bin" "$HOME/.local/bin"; do
            if [ -x "$dir/vp" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::vp was not found in any known install location after running the installer"
          exit 1

      - name: Install front deps
        working-directory: front
        run: vp install

      - name: Build SPA
        working-directory: front
        run: vp build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: front-dist
          path: front/dist
          if-no-files-found: error

  build-host:
    name: Build host (${{ matrix.target }})
    needs: build-front
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            use_cross: false
          # aarch64-unknown-linux-gnu temporarily disabled: cross's bundled
          # toolchain is too old for the rust-embed macro. Re-enable once
          # cross ships a newer rustc or we move to a native arm64 runner.
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
            use_cross: false
          # x86_64-apple-darwin temporarily disabled: macos-13 (Intel) hosted
          # runners frequently sit in "waiting for runner" for many minutes,
          # blocking release publication. Re-enable once we have a reliable
          # Intel runner or decide to drop Intel mac support permanently.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            use_cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download front bundle
        uses: actions/download-artifact@v8
        with:
          name: front-dist
          path: front/dist

      # Same pin as the CI workflow, read from `server-rs/rust-toolchain.toml`
      # at the tag being built, so a release is reproducible against a known
      # compiler rather than whatever `stable` was on the day it ran.
      - name: Resolve pinned Rust toolchain
        id: toolchain
        shell: bash
        run: .github/scripts/rust-channel.sh

      # Pinned to a SHA, not `@master`, for the same reason as the CI workflow:
      # a mutable branch ref decides what runs inside a job that signs and
      # uploads release artifacts.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        working-directory: server-rs
        run: cargo build --release --bin agent-start-host --bin agent-start --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        working-directory: server-rs
        run: cross build --release --bin agent-start-host --bin agent-start --target ${{ matrix.target }}

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          target="${{ matrix.target }}"
          name="agent-start-${tag}-${target}"
          mkdir -p "dist/${name}"
          cp "server-rs/target/${target}/release/agent-start-host" "dist/${name}/"
          cp "server-rs/target/${target}/release/agent-start" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/" 2>/dev/null || true
          (cd dist && tar czf "${name}.tar.gz" "${name}")
          echo "ASSET=dist/${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $target = "${{ matrix.target }}"
          $name = "agent-start-$tag-$target"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "server-rs/target/$target/release/agent-start-host.exe" "dist/$name/"
          Copy-Item "server-rs/target/$target/release/agent-start.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/" -ErrorAction SilentlyContinue
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          echo "ASSET=dist/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download all archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          # --verify-tag refuses to create a release for a tag that does not
          # already exist, so a typo in `inputs.tag` (or a missing push) fails
          # loudly instead of silently creating the tag off the default branch.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.zip --clobber
          else
            gh release create "$tag" \
              --title "$tag" \
              --verify-tag \
              --generate-notes \
              dist/*.tar.gz dist/*.zip
          fi

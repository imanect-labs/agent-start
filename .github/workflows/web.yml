name: web

on:
  push:
    branches: [main]
    paths-ignore:
      - "server-rs/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths-ignore:
      - "server-rs/**"
      - ".github/workflows/rust.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v6
      - name: Install Vite+ (vp)
        run: |
          curl -fsSL https://vite.plus | bash
          # The installer drops the binary somewhere under $HOME and has moved it
          # before, so probe every known location and fail loudly when none has it
          # rather than letting the next step die with "vp: command not found".
          for dir in "$HOME/.local/share/vite-plus/bin" "$HOME/.vite-plus/bin" "$HOME/.local/bin"; do
            if [ -x "$dir/vp" ]; then
              echo "$dir" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::vp was not found in any known install location after running the installer"
          exit 1
      # vp install pulls the toolchain (node, vite, oxlint, oxfmt, tsgo).
      - run: vp install
      - run: vp check
      - run: vp build
